<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="50%" stop-color="#00c8ff" />
      <stop offset="100%" stop-color="#9d00ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Hex Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="4" />
  
  <!-- Outer Circuit Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00ff9d" stroke-width="3" stroke-dasharray="14 10" opacity="0.4" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyberNeon)" stroke-width="6" opacity="0.8" />
  
  <!-- Pulse Wave Graph Line -->
  <path d="M 120 256 L 180 256 L 210 180 L 256 340 L 302 140 L 332 256 L 392 256" 
        fill="none" 
        stroke="#00ff9d" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />
        
  <!-- Core Monogram NP -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" font-weight="900" fill="#00ff9d" letter-spacing="8" text-anchor="middle" opacity="0.9">
    NEXUS•PULSE
  </text>
  
  <!-- Pulse Orb Center -->
  <circle cx="256" cy="256" r="12" fill="#00ff9d" filter="url(#neonGlow)" />
  <circle cx="302" cy="140" r="8" fill="#00c8ff" filter="url(#neonGlow)" />
  <circle cx="210" cy="180" r="7" fill="#9d00ff" filter="url(#neonGlow)" />
</svg>
